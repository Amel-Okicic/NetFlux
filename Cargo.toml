[package]
name = "netflux"
version = "1.0.0"
edition = "2024"
description = "A source-available per-process bandwidth monitor and limiter for Windows"
repository = "https://github.com/Amel-Okicic/NetFlux"
# Licensing is file- and contribution-specific; see LICENSE and LICENSES.md.

[dependencies]
anyhow = "1.0.103"
crossbeam-channel = "0.5.16"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg"] }
egui_plot = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3"
windivert = "0.6.0"
windivert-sys = "0.10.0"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
resvg = "0.45"
tray-icon = "0.21"

[build-dependencies]
embed-manifest = "1"
winresource = "0.1.31"
resvg = "0.45"
